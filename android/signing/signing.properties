# Release signing for Ferry (decision H38, replaces H18 when the repo became public).
# The keystore is stored ENCRYPTED as ferry-release.jks.enc. CI decrypts it with the repository
# secret FERRY_SIGNING_PASS (also the store and key password). Every Ferry APK must be signed with
# this key, or app updates fail. Backup of the passphrase: the user's claude.ai project "Ferry".
storeFile=signing/ferry-release.jks
keyAlias=ferry
