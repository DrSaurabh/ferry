name: pc
on:
  push:
    branches-ignore: [dist]
    paths: ["pc/**", "tools/**", "docs/v2.1-log-events.md", ".github/workflows/pc.yml"]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, py: "3.8" }
          - { os: windows-latest, py: "3.13" }
          - { os: ubuntu-22.04, py: "3.8" }      # ubuntu-latest (26.04) has no Python 3.8
          - { os: ubuntu-latest, py: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.py }}" }
      - run: python -m pip install pytest
      - run: python -m pytest -q -ra --junitxml=pytest.xml
      - name: tools tests (third pytest root, 2.1 CP124)
        working-directory: .
        run: python -m pytest -q -ra tools/tests
      - name: Collect logs
        if: failure()
        shell: python
        run: |
          import glob, os, shutil, tempfile
          os.makedirs("../pc-test-logs", exist_ok=True)
          files = glob.glob("pytest.xml") + glob.glob(os.path.join(tempfile.gettempdir(), "pytest-of-*", "**", "ferry-log*.txt"), recursive=True)
          for i, f in enumerate(files):
              shutil.copy(f, os.path.join("../pc-test-logs", "%d-%s" % (i, os.path.basename(f))))
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pc-test-logs-${{ matrix.os }}-py${{ matrix.py }}
          path: pc-test-logs/
          if-no-files-found: ignore
