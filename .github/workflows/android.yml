# Ferry Android CI (plan §5.2). NEVER rename this file: versionCode = 20000 + its run number [H26].
# Branch pushes run the fast jobs only; emulator suites run on main, on a manual run, or on a branch
# when the head commit message carries [emu] / [emu:phone] / [emu:tv] / [emu:api25] [H28] [CP18].
# On main, `package` builds the PC zip with the APK (artifact Ferry-2.0.<n>, or -UNVERIFIED unless all three
# emulator suites passed [CP19]) and `dist` commits a verified zip + APK to the orphan branch `dist` (B38).
name: android
on:
  push:
    branches-ignore: [dist]
    paths: ["android/**", "pc/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      emulators:
        description: "Emulator suites to run"
        type: choice
        options: [all, phone, tv, api25, none]
        default: all

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token everywhere; only the dist job may write (B38).
permissions:
  contents: read

env:
  FERRY_RELEASE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
  FERRY_RUN_NUMBER: ${{ github.run_number }}

jobs:
  core-jvm:
    # :core unit tests + integration tests against the real pc/ferry.py, on Linux and Windows [B14] (plan §5.2).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: gradle/actions/setup-gradle@v4
      - name: core JVM tests
        working-directory: android
        shell: bash
        env: { CI: "true", FERRY_PYTHON: python }
        run: ./gradlew --no-daemon :core:test
      - name: Test results into the log (artifacts are not downloadable from the agent workspace, B27)
        if: always()
        shell: bash
        run: python android/ci/junit_summary.py android/core/build/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports-${{ matrix.os }}
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
          if-no-files-found: ignore

  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pytest
      - uses: gradle/actions/setup-gradle@v4
      - name: CI script tests
        run: python -m pytest -q android/ci
      - name: Unit tests, lint (NewApi), release + debug + androidTest APKs, share helper APK (CP21)
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :sharehelper:assembleDebug
      - name: Check the release APK (manifest, certificate, libraries, version) and write Ferry.apk.json
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          if [ "$FERRY_RELEASE" = 1 ]; then CODE=$((20000 + FERRY_RUN_NUMBER)); NAME="2.0.$FERRY_RUN_NUMBER"; else CODE=1; NAME=2.0.0-dev; fi
          APK=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p out/ferry-apk out/test-apks
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > out/manifest.txt
          echo "----- release manifest (aapt2 dump xmltree) -----"; cat out/manifest.txt; echo "-----"
          python android/ci/check_manifest.py out/manifest.txt
          unzip -l "$APK" 'lib/*' || true
          python android/ci/check_apk.py "$APK" --build-tools "$BT" --expect-code "$CODE" --expect-name "$NAME"
          cp "$APK" out/ferry-apk/Ferry.apk
          python android/ci/make_apk_json.py out/ferry-apk/Ferry.apk "$CODE" "$NAME" > out/ferry-apk/Ferry.apk.json
          cat out/ferry-apk/Ferry.apk.json
          cp android/app/build/outputs/apk/debug/app-debug.apk out/test-apks/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/test-apks/
          cp android/sharehelper/build/outputs/apk/debug/sharehelper-debug.apk out/test-apks/
      - uses: actions/upload-artifact@v4
        with: { name: ferry-apk, path: out/ferry-apk/ }
      - uses: actions/upload-artifact@v4
        with: { name: ferry-test-apks, path: out/test-apks/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-unit-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  emulator-phone:
    needs: app-build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","phone"]'), inputs.emulators))
      || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[emu]')
          || contains(github.event.head_commit.message, '[emu:phone]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ferry-test-apks, path: apks }
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v2
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sleep 45 && echo "AVD snapshot created (after 45 s to settle)"
      - name: Phone suite (attempt 1)
        id: try1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash android/ci/run_instrumented.sh phone 1
      - name: Phone suite (attempt 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-snapshot-load
          script: bash android/ci/run_instrumented.sh phone 2
      - name: Result
        if: steps.try1.outcome == 'failure' && steps.try2.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: instrumented-phone, path: ci-out/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots-phone, path: ci-out/*/screenshots/, if-no-files-found: ignore }

  emulator-tv:
    needs: app-build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","tv"]'), inputs.emulators))
      || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[emu]')
          || contains(github.event.head_commit.message, '[emu:tv]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ferry-test-apks, path: apks }
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Big video cache
        uses: actions/cache@v4
        with:
          path: ~/big-video
          key: big-video-${{ hashFiles('android/ci/make_big_video.sh') }}
      - name: Big video
        run: bash android/ci/make_big_video.sh ~/big-video/big.mp4
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-android-tv-x86-v2
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sleep 45 && echo "AVD snapshot created (after 45 s to settle)"
      - name: TV suite (attempt 1)
        id: try1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash android/ci/run_instrumented.sh tv 1
      - name: TV suite (attempt 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-snapshot-load
          script: bash android/ci/run_instrumented.sh tv 2
      - name: Result
        if: steps.try1.outcome == 'failure' && steps.try2.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: instrumented-tv, path: ci-out/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots-tv, path: ci-out/*/screenshots/, if-no-files-found: ignore }

  emulator-api25:
    needs: app-build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","api25"]'), inputs.emulators))
      || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[emu]')
          || contains(github.event.head_commit.message, '[emu:api25]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No AVD snapshot for API 25 (B12): a cold boot takes ~15 s, while booting from a snapshot hung
    # ("Timeout waiting for emulator to boot") twice in Ph0b.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ferry-test-apks, path: apks }
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: API 25 suite (attempt 1)
        id: try1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 25
          target: default
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash android/ci/run_instrumented.sh api25 1
      - name: API 25 suite (attempt 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 25
          target: default
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash android/ci/run_instrumented.sh api25 2
      - name: Result
        if: steps.try1.outcome == 'failure' && steps.try2.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: instrumented-api25, path: ci-out/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots-api25, path: ci-out/*/screenshots/, if-no-files-found: ignore }

  package:
    # The user zip (plan §5.2, §5.3) [B25] [CP7] [CP19]: main only; waits for every job and reads their results.
    needs: [core-jvm, app-build, emulator-phone, emulator-tv, emulator-api25]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.core-jvm.result == 'success' && needs.app-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      name: ${{ steps.zip.outputs.name }}
      verified: ${{ steps.zip.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pytest
      - name: PC tests (Linux)
        run: python -m pytest -q pc/tests
      - uses: actions/download-artifact@v4
        with: { name: ferry-apk, path: pc/app }
      - name: Build Ferry-<version>.zip
        id: zip
        env:
          PHONE: ${{ needs.emulator-phone.result }}
          TV: ${{ needs.emulator-tv.result }}
          API25: ${{ needs.emulator-api25.result }}
        run: |
          python pc/tools/package.py --app-dir pc/app --out dist
          ZIP=$(ls dist/Ferry-*.zip)
          VER=${ZIP#dist/Ferry-}; VER=${VER%.zip}
          if [ "$PHONE" = success ] && [ "$TV" = success ] && [ "$API25" = success ]; then
            SUFFIX=""; VERIFIED=true
          else
            SUFFIX="-UNVERIFIED"; VERIFIED=false
          fi
          echo "name=Ferry-$VER$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          unzip -l "$ZIP"
          {
            echo "### Ferry-$VER$SUFFIX"
            echo "emulator-phone: $PHONE · emulator-tv: $TV · emulator-api25: $API25"
            if [ -n "$SUFFIX" ]; then echo "**Not verified: do not give this zip to the user [H29].**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/Ferry-*.zip
          retention-days: 90

  dist:
    # Delivery workaround (B38): the agent workspace cannot download Actions artifacts (proxy 403), so a
    # VERIFIED main zip and its APK are also committed to the orphan branch `dist` (only the latest files,
    # force-pushed). Only this job gets a token that can write. `dist` is never merged into main.
    needs: package
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Skip unverified builds
        if: needs.package.outputs.verified != 'true'
        run: |
          echo "dist: ${{ needs.package.outputs.name }} is not verified (an emulator suite did not pass); dist not updated"
      - uses: actions/download-artifact@v4
        if: needs.package.outputs.verified == 'true'
        with: { name: "${{ needs.package.outputs.name }}", path: dl }
      - uses: actions/download-artifact@v4
        if: needs.package.outputs.verified == 'true'
        with: { name: ferry-apk, path: apk }
      - name: Commit the zip and the APK to the dist branch
        if: needs.package.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ needs.package.outputs.name }}
        run: |
          set -euo pipefail
          mkdir site
          cp dl/Ferry-*.zip apk/Ferry.apk apk/Ferry.apk.json site/
          printf '%s\nmain commit %s\nandroid.yml run %s (%s)\n' "$NAME" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ID" > site/BUILD.txt
          cd site
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE=$(git write-tree)
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "$(git ls-remote "$URL" refs/heads/dist)" ]; then
            git fetch -q --depth 1 "$URL" dist
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$TREE" ]; then
              echo "dist: nothing changed ($NAME already on dist)"; exit 0
            fi
          fi
          git commit -q -m "dist: $NAME (main ${GITHUB_SHA:0:7}, run $GITHUB_RUN_NUMBER)"
          git push -q --force "$URL" HEAD:refs/heads/dist
          echo "dist: pushed $NAME"; ls -l
